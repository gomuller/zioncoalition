name: PNG optimization audit (read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/png-optimization-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Analyze five representative PNGs without changing originals
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import io,json
          samples=[
            'images/02-early-days-sac-1.2.png',
            'images/01-jesus-game.png',
            'images/01-tomblibrary.png',
            'images/01-redeemed-phone.png',
            'images/01-playbill.png',
          ]
          report=[]
          for name in samples:
              p=Path(name)
              with Image.open(p) as im:
                  im.load()
                  out={}
                  for label,fmt,kw in [
                    ('png_optimized','PNG',{'optimize':True,'compress_level':9}),
                    ('webp_lossless','WEBP',{'lossless':True,'method':6}),
                    ('webp_quality85','WEBP',{'quality':85,'method':6})]:
                      buf=io.BytesIO()
                      im.save(buf,format=fmt,**kw)
                      out[label]=len(buf.getvalue())
                  report.append({'file':name,'dimensions':list(im.size),'mode':im.mode,'original_bytes':p.stat().st_size,**out})
          print('PNG_AUDIT_JSON_START')
          print(json.dumps(report,indent=2))
          print('PNG_AUDIT_JSON_END')
          original=sum(x['original_bytes'] for x in report)
          for kind in ['png_optimized','webp_lossless','webp_quality85']:
              total=sum(x[kind] for x in report)
              print(f'{kind}: {total:,} bytes vs {original:,} original; reduction {(1-total/original)*100:.1f}%')
          print('Read-only audit: no source images or references modified.')
          PY
