name: Stable web asset inventory (read only)
on:
  push:
    branches: [experiment/lean-pages-deployment]
    paths:
      - 'tools/audit_web_asset_urls.py'
      - '.github/workflows/stable-web-asset-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory literal media URL references in web sources only
        run: python3 tools/audit_web_asset_urls.py
