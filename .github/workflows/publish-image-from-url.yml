name: Publish an image from a URL

on:
  push:
    branches: [main]
    paths:
      - 'image-publish-request.json'
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Public HTTPS URL of a JPEG, PNG, or WebP image'
        required: true
        type: string
      filename:
        description: 'Destination filename at repository root (e.g. 01-my-artwork.jpg)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-image-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true
      - name: Read image publishing request
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json, os
          with open('image-publish-request.json', encoding='utf-8') as f:
              request = json.load(f)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              for key, field in [('REQUEST_IMAGE_URL','image_url'),('REQUEST_FILENAME','filename')]:
                  value = request[field]
                  if not isinstance(value,str) or '\n' in value or '\r' in value:
                      raise SystemExit('Invalid request value')
                  env.write(f'{key}={value}\n')
          PY
      - name: Validate, download and inspect image
        env:
          IMAGE_URL: ${{ github.event_name == 'push' && env.REQUEST_IMAGE_URL || inputs.image_url }}
          FILENAME: ${{ github.event_name == 'push' && env.REQUEST_FILENAME || inputs.filename }}
        run: |
          python -m pip install --quiet Pillow gdown
          python - <<'PY'
          import os, re, socket, ipaddress, urllib.parse, urllib.request
          from PIL import Image
          from io import BytesIO
          url = os.environ['IMAGE_URL']
          filename = os.environ['FILENAME']
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,119}\.(?:jpg|jpeg|png|webp)', filename, re.I):
              raise SystemExit('Use a simple .jpg, .png, or .webp filename without directories')
          parsed = urllib.parse.urlparse(url)
          if parsed.scheme != 'https' or not parsed.hostname or parsed.username or parsed.password:
              raise SystemExit('A public HTTPS URL is required')
          def public_host(host):
              for item in socket.getaddrinfo(host, None):
                  ip = ipaddress.ip_address(item[4][0])
                  if not ip.is_global:
                      raise SystemExit('Private or non-public network address rejected')
          drive_id = None
          if parsed.hostname in ('drive.google.com', 'www.drive.google.com'):
              match = re.fullmatch(r'/file/d/([A-Za-z0-9_-]+)/(?:view)?/?', parsed.path)
              if match:
                  drive_id = match.group(1)
              else:
                  raise SystemExit('Expected a Google Drive /file/d/FILE_ID/view URL')
          if not drive_id:
              public_host(parsed.hostname)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise SystemExit('Redirects are not supported; provide the final HTTPS image URL')
          opener = urllib.request.build_opener(NoRedirect)
          req = urllib.request.Request(url, headers={'User-Agent': 'zioncoalition-image-publisher/1.0'})
          if drive_id:
              import gdown
              from tempfile import TemporaryDirectory
              with TemporaryDirectory() as tmp:
                  source = os.path.join(tmp, 'download')
                  result = gdown.download(id=drive_id, output=source, quiet=False)
                  if not result:
                      raise SystemExit('Google Drive download failed; check public Viewer sharing')
                  with open(source, 'rb') as incoming:
                      data = incoming.read(10_000_001)
          else:
              with opener.open(req, timeout=30) as response:
                  data = response.read(10_000_001)
          if len(data) > 10_000_000:
              raise SystemExit('Image exceeds 10 MB')
          im = Image.open(BytesIO(data))
          im.verify()
          actual = Image.open(BytesIO(data))
          expected = {'.jpg':'JPEG','.jpeg':'JPEG','.png':'PNG','.webp':'WEBP'}[os.path.splitext(filename)[1].lower()]
          if actual.format != expected:
              raise SystemExit(f'Image format mismatch: expected {expected}, got {actual.format}')
          if actual.width * actual.height > 60_000_000:
              raise SystemExit('Image pixel count too large')
          with open(filename,'wb') as out:
              out.write(data)
          print(f'Validated {filename}: {actual.width}x{actual.height}, {len(data)} bytes')
          PY
      - name: Commit published image
        env:
          FILENAME: ${{ github.event_name == 'push' && env.REQUEST_FILENAME || inputs.filename }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$FILENAME"
          if git diff --cached --quiet; then
            echo "Image already matches existing file."
          else
            git commit -m "Publish image: $FILENAME"
            git push origin HEAD:main
          fi
