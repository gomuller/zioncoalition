<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320"><rect width="480" height="320" fill="#17324d"/><circle cx="400" cy="70" r="100" fill="#bd8752" opacity=".4"/><text x="24" y="72" fill="#fff4da" font-family="Georgia,serif" font-size="34" font-weight="bold">Jesus is pretty tricky...</text><text x="24" y="127" fill="#fff" font-family="Arial" font-size="26">He can get the devil</text><text x="24" y="164" fill="#fff" font-family="Arial" font-size="26">to do His work</text><text x="24" y="229" fill="#ffda92" font-family="Arial" font-size="19">“Dam, I should never have</text><text x="24" y="255" fill="#ffda92" font-family="Arial" font-size="19">tempted Eve”</text><text x="330" y="294" fill="#fff" font-family="Georgia" font-size="19" font-style="italic">Hope for Zion</text></svg>